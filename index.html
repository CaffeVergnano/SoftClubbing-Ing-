<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee Personas Quiz</title>

 <style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    min-height: 100vh;
    padding: 24px;

    display: flex;
    align-items: center;
    justify-content: center;

    background-image: url("https://raw.githubusercontent.com/CaffeVergnano/SoftClubbing-/refs/heads/main/sfondo.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    color: #6f4e37;
  }

  .app {
    width: 100%;
    max-width: 820px;
    padding: 32px;

    background: #ede5da;
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(59, 36, 23, 0.15);
  }

  /* Titolo iniziale */

  .title {
    margin-bottom: 10px;

    font-family: "Poppins", Arial, sans-serif;
    font-size: 2rem;
    font-weight: 700;
    text-align: center;
  }

  .subtitle {
    margin-bottom: 28px;

    font-family: "Poppins", Arial, sans-serif;
    line-height: 1.5;
    text-align: center;
    color: #6f4e37;
  }

  /* Email e privacy */

  .email-box {
    display: grid;
    gap: 14px;
  }

  .email-input {
    width: 100%;
    padding: 16px 18px;

    border: 1px solid #e0cbbb;
    border-radius: 16px;
    background: #ffffff;

    font-size: 1rem;
    color: #3b2417;
  }

  .email-input:focus {
    outline: 2px solid #b57b55;
    outline-offset: 2px;
  }

  .privacy-box {
    display: grid;
    gap: 12px;

    font-size: 0.9rem;
    line-height: 1.4;
    color: #6a4a3a;
  }

  .privacy-label {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .privacy-label input {
    flex-shrink: 0;
    margin-top: 3px;
  }

  .privacy-small {
    font-size: 0.85rem;
    line-height: 1.4;
  }

  .privacy-small a {
    color: #6f4e37;
    font-weight: 700;
  }

  /* Pulsanti */

  .start-btn,
  .answer-btn,
  .restart-btn {
    padding: 16px 18px;

    border: none;
    border-radius: 16px;

    font-size: 1rem;
    cursor: pointer;
    transition:
      background-color 0.25s ease,
      color 0.25s ease,
      transform 0.25s ease;
  }

  .start-btn,
  .restart-btn {
    width: 100%;
    background: #6f4e37;
    color: #ffffff;
  }

  .start-btn:hover,
  .restart-btn:hover {
    background: #5b3f2c;
    transform: translateY(-2px);
  }

  /* Barra di avanzamento */

  .progress-wrap {
    margin-bottom: 24px;
  }

  .progress-text {
    margin-bottom: 8px;

    font-size: 0.95rem;
    color: #6a4a3a;
  }

  .progress-bar {
    width: 100%;
    height: 10px;

    overflow: hidden;
    background: #ead9cc;
    border-radius: 999px;
  }

  .progress {
    height: 100%;

    background: linear-gradient(90deg, #6f4e37, #b57b55);
    transition: width 0.3s ease;
  }

  /* Domande */

  .question {
    margin-bottom: 22px;

    font-size: 1.4rem;
    line-height: 1.4;
  }

  .answers {
    display: grid;
    gap: 14px;
  }

  .answer-btn {
    width: 100%;

    background: #6f4e37;
    color: #ffffff;
    text-align: left;
  }

  .answer-btn:hover {
    background: #e8d2c1;
    color: #5c4033;
    transform: translateY(-2px);
  }

  /* Risultato */

  .result-badge {
    display: inline-block;
    margin-bottom: 16px;
    padding: 8px 14px;

    border-radius: 999px;
    background: #f0dfd2;

    color: #6f4e37;
    font-weight: 700;
  }

  .result-title {
    margin-bottom: 16px;
    font-size: 2rem;
  }

  .result-images {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 16px;

    margin-bottom: 24px;
  }

  .result-image {
    display: block;
    width: 100%;
    max-width: 200px;
    height: auto;
  }

  .result-description {
    font-size: 1.05rem;
    line-height: 1.5;
    color: #5c4033;
    text-align: left;
    white-space: normal;
  }

  /* Ogni blocco: Mood, Combo, Descrizione, Energia, Flags */

  .result-section {
    margin-bottom: 24px;
  }

  .result-section:last-child {
    margin-bottom: 0;
  }

  .result-label {
    margin-bottom: 8px;
    font-weight: 700;
  }

  .result-description p {
    margin: 0;
  }

  .result-description ul {
    margin: 0;
    padding-left: 24px;
  }

  .result-description li {
    margin-bottom: 5px;
    line-height: 1.4;
  }

  .result-description li:last-child {
    margin-bottom: 0;
  }

  /* Spazio tra descrizione e pulsante */

  .restart-btn {
    margin-top: 32px;
  }

  /* Messaggi */

  .error-message {
    font-size: 0.9rem;
    color: #9b2c2c;
    text-align: center;
  }

  .footer-note {
    margin-top: 20px;

    font-size: 0.9rem;
    color: #7b6253;
    text-align: center;
  }

  /* Mobile */

  @media (max-width: 640px) {
    body {
      padding: 14px;
      align-items: flex-start;
    }

    .app {
      padding: 24px 18px;
      border-radius: 18px;
    }

    .title {
      font-size: 1.7rem;
    }

    .question {
      font-size: 1.2rem;
    }

    .result-title {
      font-size: 1.6rem;
    }

    .result-description {
      font-size: 0.98rem;
    }

    .result-section {
      margin-bottom: 20px;
    }

    .result-images {
      gap: 12px;
    }

    .result-image {
      max-width: 160px;
    }

    .restart-btn {
      margin-top: 26px;
    }
  }
</style>
</head>

<body>

  <script>

  ];

  const resultsMap = {

      image: [

description: `

`

      image: [
        "https://raw.githubusercontent.com/CaffeVergnano/SoftClubbing-/main/cappuccino.png",
        "https://raw.githubusercontent.com/CaffeVergnano/SoftClubbing-/main/Cappuccino%20Socializer.png"
      ],
      description: `  <div class="result-section">
    <div class="result-label"> The Mood </div>
    <p>" The rhythm starts with good company ".</p>
  </div>
  <div class="result-section">
    <div class="result-label"> Your combo</div>
    <p> Cappuccino, peach juice & custard croissant </p>
  </div>
  <div class="result-section">
    <div class="result-label">Description:</div>
    <p> Your energy comes from interacting with others: conversations, shared experiences, or simply being with a group charge you up. Every sip of coffee is a chance to exchange ideas. For you, there’s no better way to start a good day than with breakfast among friends. You’re in no rush to dive into the daily chaos; you prefer to enjoy the foam of conversation while the beat of the day slowly builds.</p>

  <div class="result-section">

  <div class="result-section">

    <ul>
      <li>Empathetic and sensitive</li>

  <div class="result-section">

`
    },
    MP: {
      image: [
        "https://raw.githubusercontent.com/CaffeVergnano/SoftClubbing-/main/macchiato.png",

      ],
      description: `  <div class="result-section">

  </div>

   let userEmail = "";
  let currentQuestion = 0;
  let userAnswers = [];

  let scores = {
    ER: 0,
    CS: 0,
    MP: 0,
    DZ: 0,
    EM: 0
  };

  const quizContainer = document.getElementById("quiz-container");

  function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  function startQuiz() {

    const email = document.getElementById("user-email").value.trim();

    const marketingChecked =
      document.getElementById("marketing-check").checked;

    const profilingChecked =
      document.getElementById("profiling-check").checked;

    const error = document.getElementById("email-error");

    if (!isValidEmail(email)) {
      error.textContent = "Inserisci una email valida.";
      return;
    }

    if (!marketingChecked || !profilingChecked) {
      error.textContent =
        "Devi accettare entrambi i consensi per continuare.";
      return;
    }

    userEmail = email;
    error.textContent = "";

    document.getElementById("email-step").style.display = "none";

    quizContainer.style.display = "block";

    renderQuestion();
  }

  function renderQuestion() {

    const q = questions[currentQuestion];

    const progressPercent =
      (currentQuestion / questions.length) * 100;

    quizContainer.innerHTML = `
      <div class="progress-wrap">

        <div class="progress-text">
          Domanda ${currentQuestion + 1} di ${questions.length}
        </div>

        <div class="progress-bar">
          <div class="progress"
            style="width:${progressPercent}%;">
          </div>
        </div>

      </div>

      <h2 class="question">${q.question}</h2>

      <div class="answers" id="answers-container"></div>
    `;

    const answersContainer =
      document.getElementById("answers-container");

    q.answers.forEach(answer => {

      const button = document.createElement("button");

      button.className = "answer-btn";

      button.textContent = answer.text;

      button.addEventListener("click", () =>
        selectAnswer(answer)
      );

      answersContainer.appendChild(button);

    });
  }

  function selectAnswer(answer) {

    scores[answer.type]++;

    userAnswers.push({
      question: questions[currentQuestion].question,
      answer: answer.text,
      personaCode: answer.type
    });

    currentQuestion++;

    if (currentQuestion < questions.length) {
      renderQuestion();
    } else {
      showResult();
    }
  }

  function saveLead(finalType, resultName) {

    fetch(GOOGLE_ENDPOINT, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },

      body: JSON.stringify({
        email: userEmail,
        result: resultName,
        resultCode: finalType,
        marketingConsent: true,
        profilingConsent: true,
        answers: userAnswers
      })
    });
  }

  function showResult() {
  const finalType = Object.keys(scores).reduce((a, b) =>
    scores[a] >= scores[b] ? a : b
  );

  const result = resultsMap[finalType];

  const resultName = result.name || finalType;
  const resultImages = result.images || result.image;

  saveLead(finalType, resultName);

  quizContainer.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-text">Quiz completato</div>
      <div class="progress-bar">
        <div class="progress" style="width:100%;"></div>
      </div>
    </div>

    <div class="result">
      <div class="result-badge">Risultato finale</div>

      <div class="result-images">
        <img src="${resultImages[0]}" class="result-image" alt="${resultName}" />
        <img src="${resultImages[1]}" class="result-image" alt="${resultName}" />
      </div>

      <div class="result-description">${result.description}</div>

      <button class="restart-btn" onclick="restartQuiz()">Ricomincia il quiz</button>
    </div>
  `;
}
  function restartQuiz() {

    currentQuestion = 0;

    userAnswers = [];

    scores = {
      ER: 0,
      CS: 0,
      MP: 0,
      DZ: 0,
      EM: 0
    };

    document.getElementById("email-step").style.display = "block";

    quizContainer.style.display = "none";

    quizContainer.innerHTML = "";
  }
</script>
</body>
</html>
